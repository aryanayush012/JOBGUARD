<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 280px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f6f7; background: #17191d; }
    main { padding: 14px; display: grid; gap: 10px; }
    .brand { font-weight: 800; letter-spacing: -.03em; font-size: 15px; } .brand span { color: #fab81a; }
    .muted { color: #a7adb7; } .err { color: #ff8b8b; }
    button { border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 700; cursor: pointer; background: #fab81a; color: #17130a; }
    button:disabled { opacity: .5; cursor: default; }
    a { color: #a7adb7; }
    .due { display: grid; gap: 6px; }
    .due h2 { margin: 4px 0 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #a7adb7; }
    .job { display: grid; gap: 2px; text-align: left; background: #101114; color: #f5f6f7; border: 1px solid #2b2f36; border-radius: 10px; padding: 8px 10px; font-weight: 400; }
    .job:hover { border-color: #fab81a; } .job b { font-weight: 700; } .job span { color: #a7adb7; font-size: 12px; } .job .soon { color: #fab81a; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="icons/icon32.png" width="18" height="18" alt="" style="vertical-align:-3px;margin-right:6px">JOB<span>GUARD</span> Autofill</div>
    <div id="status" class="muted">Checking connection…</div>
    <button id="fill" disabled>Fill this page</button>
    <div id="msg" class="muted"></div>
    <div id="due" class="due"></div>
    <a href="#" id="settings">Advanced settings</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
